<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cahier de français</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cahier">
<meta name="theme-color" content="#F5F6F8">
<style>
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --ink:#16181D; --muted:#5D6472; --faint:#8A919E;
  --line:#E1E4EA; --soft:#EDF0F5;
  --accent:#2A44C4; --accent-ink:#FFFFFF; --accent-soft:#E5E9FA;
  --ok:#1D7A4F; --ok-soft:#E2F2E9; --warn:#946010; --warn-soft:#FAEFD9; --bad:#B23A26; --bad-soft:#F7E4DF;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1115; --surface:#171A20; --ink:#E8EBF0; --muted:#A0A7B4; --faint:#747C8A;
    --line:#272B33; --soft:#1D2129;
    --accent:#90A2FF; --accent-ink:#0D1233; --accent-soft:#222A4D;
    --ok:#5DC08F; --ok-soft:#15281E; --warn:#E3AA4E; --warn-soft:#2B2313; --bad:#F27E68; --bad-soft:#2E1813;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1115; --surface:#171A20; --ink:#E8EBF0; --muted:#A0A7B4; --faint:#747C8A;
  --line:#272B33; --soft:#1D2129;
  --accent:#90A2FF; --accent-ink:#0D1233; --accent-soft:#222A4D;
  --ok:#5DC08F; --ok-soft:#15281E; --warn:#E3AA4E; --warn-soft:#2B2313; --bad:#F27E68; --bad-soft:#2E1813;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 64px}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:680px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin-inline:-16px;padding:10px 16px 0;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-style:italic;font-size:19px;letter-spacing:.005em;margin-right:auto}
.sync{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.sync.on i{background:var(--ok)} .sync.err i{background:var(--bad)}
.tabs{display:flex;gap:4px;width:100%;margin-top:6px}
.tab{appearance:none;border:0;background:none;padding:10px 12px 11px;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}

/* day header */
.dayhead{padding-block:28px 18px}
.dayhead .nav{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.iconbtn svg{width:16px;height:16px}
.date-ru{font-size:30px;line-height:1.15;font-weight:600;letter-spacing:-.01em;text-wrap:balance;margin:14px 0 2px}
.date-fr{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;font-size:14px;color:var(--muted)}
.pill{font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.study{background:var(--accent-soft);color:var(--accent)}
.pill.deload{background:var(--ok-soft);color:var(--ok)}
.pill.light{background:var(--warn-soft);color:var(--warn)}
.topic{font-family:var(--serif);font-size:20px;margin-top:10px;text-wrap:balance}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.num{font-variant-numeric:tabular-nums}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:18px;font-size:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.notice p{margin:0;flex:1 1 220px}

/* steps */
.steps{display:flex;flex-direction:column;gap:10px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.step.open{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.stephead{appearance:none;background:none;border:0;width:100%;display:flex;align-items:center;gap:14px;padding:16px;text-align:left;cursor:pointer}
.dot{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.step.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dot svg{width:12px;height:12px}
.stepname{flex:1;font-weight:500}
.step.done .stepname{color:var(--muted)}
.stepmin{font-size:13px;color:var(--faint)}
.step.locked .stephead{cursor:default}
.step.locked .stepname{color:var(--faint)}
.stepbody{padding:0 16px 18px;border-top:1px solid var(--line)}
.stepfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.lead{color:var(--muted);font-size:15px;margin:14px 0 0}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn:disabled{opacity:.45;cursor:default}
.btn.big{width:100%;justify-content:space-between;padding:16px 18px;border-radius:var(--r);font-size:16px}
.btn .sub{font-weight:400;color:var(--muted);font-size:13px}
.btn.primary .sub{color:inherit;opacity:.8}
.linkcard{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left}
.speak{appearance:none;border:0;background:var(--soft);color:var(--accent);width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;vertical-align:middle}
.speak svg{width:14px;height:14px}

/* French text */
.fr{font-family:var(--serif)}
.tok{cursor:pointer;border-radius:3px;text-decoration:underline dotted color-mix(in srgb,var(--faint) 60%,transparent);text-underline-offset:4px}
.tok:hover{background:var(--accent-soft)}

/* theory */
.th{margin-top:22px}
.th h3{font-size:17px;margin:0 0 6px;font-weight:600}
.th p{margin:0 0 10px;max-width:62ch}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row .fr{flex:1 1 45%;font-size:17px}
.row .ru{flex:1 1 45%;color:var(--muted);font-size:15px}
.table{display:grid;grid-template-columns:auto 1fr;gap:0 18px;margin:6px 0 12px;border-top:1px solid var(--line)}
.table>div{padding:7px 0;border-bottom:1px solid var(--line)}
.table .fr{font-size:17px}
.table .ru{color:var(--muted);font-size:15px}

/* vocab */
.vocab{margin-top:14px;display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.vrow .w{font-family:var(--serif);font-size:19px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.g{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.vrow .t{color:var(--muted);grid-column:1}
.vrow .e{grid-column:1/-1;font-size:14px;color:var(--faint)}
.vrow .e .fr{color:var(--muted);font-style:italic;font-size:15px}
.vrow .speak{grid-row:1/3;grid-column:2;align-self:center}

/* exercises */
.exhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-size:14px;color:var(--muted)}
.ex{padding:18px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.exlabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.exq{font-size:17px;margin-bottom:10px}
.exq.fr{font-size:19px}
.hint{font-size:14px;color:var(--muted);margin:-4px 0 10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:16px}
.opt.fr{font-family:var(--serif)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-size:17px;font-family:var(--serif);min-width:0;width:100%}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.inp.inline{width:auto;min-width:6ch;max-width:14ch;display:inline-block;padding:4px 10px;margin:0 4px}
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line .inp{flex:1 1 200px}
.gapline{font-family:var(--serif);font-size:19px;line-height:2.1}
.conj{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;max-width:420px}
.conj .p{font-family:var(--serif);font-size:18px;color:var(--muted);text-align:right}
.chip{cursor:grab;touch-action:none}
.ghost{opacity:.35}
.quiz .ex:first-of-type{padding-top:8px}
.fun{margin-top:28px;padding-top:18px;border-top:1px dashed var(--line)}
.funlabel{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.player{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.pinner{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ptitle{font-weight:500;font-size:14px;flex:1 1 160px}
.player audio{flex:1 1 260px;max-width:100%;height:36px}
body.has-player{padding-bottom:110px}
.answerline{min-height:48px;border:1px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px}
.match .opt{width:100%;text-align:left}
.fb{margin-top:10px;font-size:15px;padding:9px 12px;border-radius:10px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.almost{background:var(--warn-soft);color:var(--warn)}
.fb.wrong{background:var(--bad-soft);color:var(--bad)}
.fb b{font-family:var(--serif);font-weight:500}
.fb mark{background:none;color:inherit;text-decoration:underline 2px;text-underline-offset:3px;font-weight:700}
.play{display:flex;gap:8px;margin-bottom:10px}

/* review */
.card{border:1px solid var(--line);border-radius:var(--r);padding:26px 20px;margin-top:14px;background:var(--bg);text-align:center}
.card .front{font-family:var(--serif);font-size:34px;line-height:1.2;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.card .back{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.card .back .t{font-size:20px}
.card .back .e{color:var(--muted);font-size:15px}
.card .back .e .fr{font-style:italic;font-size:16px;color:var(--ink)}
.card.topic{text-align:left}
.card.topic .front{font-family:var(--sans);font-size:20px;justify-content:flex-start}
.qz{margin-top:14px}
.qz .exq{font-size:16px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grade{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500}
.grade small{font-weight:400;color:var(--faint);font-size:12px}
.grade.sug{border-color:var(--accent);background:var(--accent-soft)}
.qcount{font-size:13px;color:var(--faint);margin-top:14px}

/* homework */
textarea.inp{min-height:150px;resize:vertical;line-height:1.5}
.counter{font-size:13px;color:var(--faint)}
.feedback{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px;font-size:15px}
.history{margin-top:18px}
.history summary{cursor:pointer;color:var(--muted);font-size:14px}
.hitem{border-top:1px solid var(--line);padding:12px 0}
.hitem .fr{font-size:16px;white-space:pre-wrap}
.hitem .when{font-size:12px;color:var(--faint)}

/* reader */
.reader{font-family:var(--serif);font-size:19px;line-height:1.75;margin-top:14px;white-space:pre-wrap;max-width:62ch}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.cal .wd{font-size:12px;color:var(--faint);text-align:center;padding-bottom:2px}
.cell{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;aspect-ratio:1/1;max-width:100%;padding:6px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;cursor:pointer;font-variant-numeric:tabular-nums;font-size:15px;min-width:0}
.cell.rest{background:var(--soft);border-color:transparent;color:var(--faint)}
.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cell .mini{width:100%;height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.cell .mini i{display:block;height:100%;background:var(--accent)}
.cell.missed .mini{background:var(--warn-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:12px}
.dlist{margin-top:26px;border-top:1px solid var(--line)}
.ditem{appearance:none;background:none;border:0;border-bottom:1px solid var(--line);width:100%;display:grid;grid-template-columns:56px 1fr auto;gap:12px;padding:12px 0;text-align:left;cursor:pointer;align-items:baseline}
.ditem .d{color:var(--faint);font-size:14px}
.ditem .n{font-size:15px}
.ditem .s{font-size:13px;color:var(--faint)}
h2.sec{font-size:24px;font-weight:600;margin:28px 0 4px;letter-spacing:-.01em}

/* cards view */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.clist{margin-top:10px}
.crow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.crow .w{font-family:var(--serif);font-size:17px}
.crow .t{color:var(--muted);font-size:14px}
.crow .due{font-size:12px;color:var(--faint);text-align:right}

/* rest */
.rest-hero{padding-block:56px 24px}
.rest-hero .fr{font-size:44px;font-style:italic;color:var(--accent)}
.rest-hero p{color:var(--muted);max-width:44ch}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.28);z-index:40}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;z-index:41;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet .w{font-family:var(--serif);font-size:28px;display:flex;align-items:center;gap:10px}
.sheet .lem{color:var(--faint);font-size:14px;margin-top:2px}
.sheet .t{font-size:19px;margin-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:14px}
@media (max-width:480px){
  .date-ru{font-size:26px}
  .card .front{font-size:28px}
  .grades{grid-template-columns:repeat(2,1fr)}
  .stats b{font-size:22px}
  .cell{padding:4px;font-size:13px;border-radius:8px}
}
[hidden]{display:none!important}
.acct{appearance:none;border:0;background:none;font-size:12px;color:var(--muted);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.auth{max-width:380px;margin:28px auto 0}
.auth h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 6px}
.auth label,.acctform label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
.auth .inp,.acctform .inp{font-family:var(--sans)}
.auth .btn.primary{width:100%;justify-content:center;margin-top:18px;padding-block:12px}
.auth .switch{margin-top:16px;font-size:14px;color:var(--muted)}
.auth .switch button{appearance:none;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--bad);font-size:14px;min-height:1.5em;margin:10px 0 0}
.acctform .btn{margin-top:10px}
.sheet h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">Cahier de français</div>
    <div class="sync" id="sync"><i></i><span>подключение…</span></div>
    <button class="acct" id="acct" type="button" hidden></button>
    <nav class="tabs" id="tabs" aria-label="Разделы" hidden>
      <button class="tab" data-route="today" id="tab-today">Сегодня</button>
      <button class="tab" data-route="plan" id="tab-plan">План</button>
      <button class="tab" data-route="cards" id="tab-cards">Карточки</button>
    </nav>
  </div>
</header>
<main class="wrap" id="app"><p class="lead">Загружаю…</p></main>

<script>
(() => {
'use strict';

/* ---------------- boot safety: nothing external may block the page ---------------- */
function showBootError(msg) {
  const a = document.getElementById('app');
  if (a && /^Загружаю…$/.test(a.textContent.trim())) a.innerHTML = '<p class="lead">Сайт не смог запуститься на этом устройстве.</p><p class="small muted" id="booterr"></p><p><button class="btn" onclick="location.reload()">Обновить страницу</button></p>';
  const e = document.getElementById('booterr'); if (e) e.textContent = 'Причина: ' + msg;
}
window.addEventListener('error', e => showBootError((e && e.message) || 'ошибка скрипта'));
window.addEventListener('unhandledrejection', e => showBootError(String((e && e.reason && (e.reason.message || e.reason.code)) || e.reason || 'ошибка')));
function lazyExternals() {
  try {
    const l = document.createElement('link'); l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&display=swap';
    document.head.append(l);
    const sc = document.createElement('script'); sc.async = true;
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.6/Sortable.min.js';
    document.head.append(sc);
  } catch (e) {}
}
const withTimeout = (p, ms, label) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout', message: label }), ms))]);

/* ---------------- constants & utils ---------------- */

      el('p', { class: 'small muted', style: 'margin:4px 0 10px', text: 'После урока запиши по памяти фразы, которые там звучали. Claude поправит написание и переведёт, а потом их можно отправить в карточки.' }),
      ta, el('div', { class: 'stepfoot' }, aiReady() ? btn : el('span', { class: 'small muted', text: 'Автопроверка на этом сайте не подключена.' })), status, res),
    el('a', { class: 'small faint', href: step.url, target: '_blank', rel: 'noopener', style: 'display:inline-block;margin-top:12px' }, 'Нет файлов на этом устройстве? Папка на Google Drive'));
}

/* ---------------- homework ---------------- */
function renderHomework(day) {
  const hw = day.homework; const id = 'hw-' + day.date;
  const ta = el('textarea', { class: 'inp', id, placeholder: 'Пиши здесь по-французски…', spellcheck: 'false' });
  ta.value = UI.drafts[id] || '';
  const count = el('span', { class: 'counter num' });
  const upd = () => { const n = (ta.value.match(/\S+/g) || []).length; count.textContent = n + ' ' + plural(n, 'слово', 'слова', 'слов') + (hw.minWords ? ' · нужно от ' + hw.minWords : ''); };
  upd();
  ta.addEventListener('input', () => { UI.drafts[id] = ta.value; saveUI(); upd(); });
  const out = el('div', { class: 'feedback', hidden: true });
  const status = el('p', { class: 'small muted', text: '' });
  const prompt = () => 'Ты — преподаватель французского (FLE). Ученица учит язык с нуля, сейчас день ' + (diffDays(DATA.start, day.date) + 1) + ' из 30, тема дня: «' + (day.topic || '') + '».\n'
    + 'Задание: ' + hw.task + '\nЕё текст:\n«' + ta.value.trim() + '»\n\n'
    + 'Ответь по-русски, коротко и доброжелательно, строго в таком виде:\nИСПРАВЛЕННЫЙ ТЕКСТ:\n(текст целиком с исправлениями)\n\nОШИБКИ:\n- (каждая ошибка: что было → как правильно → почему, одной строкой; если ошибок нет — «ошибок нет»)\n\nКАК СКАЗАТЬ ЕСТЕСТВЕННЕЕ:\n(1–3 варианта, только с лексикой уровня A1)\n\nИТОГ: (одно предложение)';
  let ctl = null;
  const runCheck = async () => {
    if (!ta.value.trim()) { ta.focus(); return; }
    ctl = new AbortController(); out.hidden = false; out.textContent = 'Claude читает текст…'; status.textContent = '';
    checkBtn.disabled = true;
    try {
      const r = await SAMPLE(prompt(), { signal: ctl.signal, cache: false, onText: ({ text }) => { out.textContent = text; } });
      out.textContent = r.text;
      Store.addText({ day: day.date, task: hw.task, text: ta.value.trim(), feedback: r.text, at: Date.now() });
      status.textContent = 'Сохранено в истории.';
    } catch (e) { const m = aiError(e); if (e && e.text) out.textContent = e.text; else if (!m) out.hidden = true; status.textContent = m; }
    checkBtn.disabled = false;
  };
  const checkBtn = el('button', { class: 'btn primary', onclick: runCheck }, 'Проверить с Claude');
  const copyBtn = el('button', { class: 'btn', onclick: async () => {
    const p = prompt();
    try { await navigator.clipboard.writeText(p); toast('Запрос скопирован — вставь его в ChatGPT'); }
    catch (e) { out.hidden = false; out.textContent = p; status.textContent = 'Выдели текст выше и скопируй вручную.'; }
  } }, 'Скопировать запрос для ChatGPT');
  const saveBtn = el('button', { class: 'btn ghost', onclick: () => { if (!ta.value.trim()) return; Store.addText({ day: day.date, task: hw.task, text: ta.value.trim(), feedback: '', at: Date.now() }); toast('Текст сохранён'); } }, 'Сохранить без проверки');
  const hist = Object.values(Store.texts).filter(t => t.day === day.date).sort((a, b) => b.at - a.at);
  return el('div', {},
    el('p', { class: 'lead', text: hw.task }),
    hw.example ? el('details', { class: 'history' }, el('summary', { text: 'Пример' }), el('p', {}, frText(hw.example))) : null,
    el('div', { style: 'margin-top:14px' }, ta),
    el('div', { class: 'line', style: 'justify-content:space-between;margin-top:6px' }, count),
    el('div', { class: 'stepfoot' }, aiReady() ? checkBtn : null, copyBtn, saveBtn),
    status, out,
    hist.length ? el('details', { class: 'history' }, el('summary', { text: 'Мои тексты за этот день (' + hist.length + ')' }),
      hist.map(t => el('div', { class: 'hitem' }, el('div', { class: 'when', text: new Date(t.at).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) }), el('div', { class: 'fr', text: t.text }), t.feedback ? el('div', { class: 'feedback', text: t.feedback }) : null))) : null);
}

/* ---------------- plan view ---------------- */
function renderPlan() {
  const t = today();
  const root = el('div');
  const doneDays = DATA.days.filter(d => d.type !== 'выходной' && dayStats(d).done === dayStats(d).total).length;
  const studyDays = DATA.days.filter(d => d.type !== 'выходной').length;
  const minutesDone = DATA.days.reduce((a, d) => a + (d.steps || []).filter(s => s.kind !== 'review' && !s.optional && stepDone(d, s)).reduce((x, s) => x + s.min, 0), 0);
  root.append(el('h2', { class: 'sec', text: 'Октябрь 2026' }),
    el('p', { class: 'lead num', text: 'Выполнено дней: ' + doneDays + ' из ' + studyDays + ' · ~' + Math.round(minutesDone / 6) / 10 + ' ч из 80,8' }));
  const cal = el('div', { class: 'cal' }, ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => el('div', { class: 'wd', text: w })));
  const first = parse(DATA.start); const offset = (first.getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) cal.append(el('div'));
  DATA.days.forEach(d => {
    const s = dayStats(d); const rest = d.type === 'выходной';
    const missed = !rest && d.date < t && s.done < s.total;
    cal.append(el('button', { class: 'cell' + (rest ? ' rest' : '') + (d.date === t ? ' today' : '') + (missed ? ' missed' : ''), 'aria-label': ruDate(d.date) + (rest ? ', выходной' : ', выполнено ' + Math.round(s.frac * 100) + '%'), onclick: () => go('d-' + d.date) },
      el('span', { text: String(parse(d.date).getDate()) }),
      rest ? null : el('span', { class: 'mini' }, el('i', { style: 'width:' + Math.round(s.frac * 100) + '%' }))));
  });
  root.append(cal, el('div', { class: 'legend' }, el('span', { text: 'полоска — доля выполненных шагов' }), el('span', { text: 'серый — выходной' }), el('span', { text: 'рамка — сегодня' })));
  const list = el('div', { class: 'dlist' });
  DATA.days.forEach(d => {
    const s = dayStats(d); const x = parse(d.date);
    const name = d.type === 'выходной' ? 'Отдых' : d.topic || (d.plan.b1 || '').replace(/^Грамматика: /, '').replace(/ — .*$/, '');
    list.append(el('button', { class: 'ditem', onclick: () => go('d-' + d.date) },
      el('span', { class: 'd num', text: pad(x.getDate()) + ' ' + RU_WD_S[x.getDay()] }),
      el('span', { class: 'n', text: name }),
      el('span', { class: 's num', text: d.type === 'выходной' ? '' : s.done === s.total ? 'готово' : s.done + '/' + s.total })));
  });
  root.append(list);
  return root;
}

/* ---------------- cards view ---------------- */
function renderCards() {
  const root = el('div');
  const all = Object.values(Store.cards);
  const due = dueCards();
  const learned = all.filter(c => (c.ivl || 0) >= 21).length;
  root.append(el('h2', { class: 'sec', text: 'Карточки' }),
    el('div', { class: 'stats' },
      el('div', { class: 'stat' }, el('b', { text: String(all.length) }), el('span', { text: 'в колоде' })),
      el('div', { class: 'stat' }, el('b', { text: String(due.length) }), el('span', { text: 'к повторению' })),
      el('div', { class: 'stat' }, el('b', { text: String(learned) }), el('span', { text: 'выучено (≥ 3 нед)' }))));
  if (UI.review || due.length) root.append(el('div', { class: 'panel' }, renderReview(null, true)));
  const fr = el('input', { class: 'inp', id: 'add-fr', placeholder: 'слово по-французски', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
  const ru = el('input', { class: 'inp', id: 'add-ru', placeholder: aiReady() ? 'перевод (необязательно)' : 'перевод', autocomplete: 'off' });
  const msg = el('p', { class: 'small muted', text: UI.addMsg || '' });
  root.append(el('div', { class: 'panel' },
    el('div', { style: 'font-weight:500;margin-bottom:8px', text: 'Добавить слово' }),
    el('div', { class: 'line' }, fr, ru, el('button', { class: 'btn', onclick: async () => { msg.textContent = 'Добавляю…'; const err = await addWordByText(fr.value, ru.value); UI.addMsg = err || 'Добавлено: ' + fr.value.trim(); msg.textContent = UI.addMsg; if (!err) { fr.value = ''; ru.value = ''; } } }, 'Добавить')), msg));
  const q = el('input', { class: 'inp', id: 'card-q', placeholder: 'Поиск по колоде', value: UI.cardQuery, style: 'margin-top:22px' });
  const listBox = el('div', { class: 'clist' });
  const paintList = () => {
    const s = norm(q.value); UI.cardQuery = q.value;
    const rows = all.filter(c => !s || norm(c.fr || c.title || '').includes(s) || norm(c.ru || '').includes(s)).sort((a, b) => (a.due || '') < (b.due || '') ? -1 : 1);
    listBox.replaceChildren(...rows.slice(0, 300).map(c => el('div', { class: 'crow' },
      el('div', {}, el('div', { class: 'w' }, c.type === 'topic' ? 'Тема: ' + c.title : c.fr), c.ru ? el('div', { class: 't', text: c.ru }) : null),
      el('div', { class: 'due num' }, c.due <= today() ? 'сегодня' : 'через ' + fmtIvl(diffDays(today(), c.due)),
        el('br'), el('button', { class: 'btn ghost small', style: 'padding:2px 0', onclick: (e) => { const b = e.currentTarget; if (b.dataset.sure) { Store.delCard(c.id); } else { b.dataset.sure = '1'; b.textContent = 'Точно удалить?'; } } }, 'Удалить')))));
    if (!rows.length) listBox.append(el('p', { class: 'lead', text: all.length ? 'Ничего не найдено.' : 'Колода пустая. Слова появятся после шага «Словарь дня».' }));
  };
  q.addEventListener('input', paintList); paintList();
  root.append(q, listBox);
  return root;
}

/* ---------------- boot ---------------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.route)));
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
document.getElementById('acct').addEventListener('click', openAccount);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Store.refresh(); });
window.addEventListener('online', () => { if (Store.mode === 'offline' || Store.error) Store.retry(); });
(() => {
  paintSync();
  lazyExternals();
  render();
  getSample().then(() => render());
  Store.connect();
})();
})();
</script>
