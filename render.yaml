# Чертёж для Render: New → Blueprint → выбрать этот репозиторий.
# Бесплатный тариф: своих постоянных файлов у сервиса нет, поэтому база живёт в Turso.
services:
  - type: web
    name: cahier-de-francais
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        value: libsql://fr-pribludovapolina.aws-eu-north-1.turso.io
      # Токен базы — секрет: Render спросит его при создании сервиса, в репозиторий он не попадает.
      - key: TURSO_AUTH_TOKEN
        sync: false
